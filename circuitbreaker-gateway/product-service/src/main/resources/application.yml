server:
  port: 8081

spring:
  application:
    # This is the name every other service / the gateway will look
    # this service up by in Eureka - NOT the artifact name.
    name: product-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
