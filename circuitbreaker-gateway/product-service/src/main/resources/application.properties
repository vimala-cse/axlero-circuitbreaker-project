# Week 4: distributed tracing (Micrometer Tracing + Zipkin)
# Send every request's trace to Zipkin (1.0 = 100%). Fine for a demo.
management.tracing.sampling.probability=1.0
# Show traceId and spanId in every log line, so one request can be
# followed across the gateway and the services.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
