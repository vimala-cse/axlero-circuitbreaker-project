spring.application.name=recommendation-service
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Bulkhead Configuration
resilience4j.bulkhead.instances.recommendationBulkhead.max-concurrent-calls=2
resilience4j.bulkhead.instances.recommendationBulkhead.max-wait-duration=0

# TimeLimiter Configuration
resilience4j.timelimiter.instances.recommendationTimeLimiter.timeout-duration=2s
resilience4j.timelimiter.instances.recommendationTimeLimiter.cancel-running-future=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# WEEK 4 - DISTRIBUTED TRACING
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans


