# Application Configuration
spring.application.name=api-gateway
server.port=8080

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Product Service Route
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

# Inventory Service Route
spring.cloud.gateway.server.webflux.routes[1].id=inventory-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/inventory/**

# Recommendation Service Route
spring.cloud.gateway.server.webflux.routes[2].id=recommendation-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://recommendation-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/recommendations/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=recommendationCircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/recommendations
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.statusCodes=INTERNAL_SERVER_ERROR

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.sliding-window-size=4
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always